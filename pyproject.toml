[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "engineerworkflow"
version = "0.1.0"
description = "Offline evidence-first network engineering workflow starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
engineerworkflow = "engineerworkflow.__main__:main"

[tool.setuptools.packages.find]
include = ["engineerworkflow*"]
